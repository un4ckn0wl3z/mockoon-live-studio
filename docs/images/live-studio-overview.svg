<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Mockoon Live Studio interface overview</title>
  <desc id="desc">An annotated overview of the Live Studio route editor, environment tools, response editor, and live synchronization controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ff3f"/>
      <stop offset="1" stop-color="#9fbd19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #77808f; }
      .label { fill: #8d96a6; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .body { fill: #dce2ea; font-size: 17px; }
      .small { fill: #8f98a8; font-size: 14px; }
      .strong { fill: #f5f7fa; font-size: 18px; font-weight: 700; }
      .callout { fill: #d9ff3f; font-size: 16px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#background)"/>
  <rect x="24" y="24" width="1392" height="772" rx="22" fill="#0b0f15" stroke="#242b36" filter="url(#shadow)"/>

  <g class="ui">
    <!-- top bar -->
    <rect x="24" y="24" width="1392" height="76" rx="22" fill="#0a0d12"/>
    <path d="M24 100h1392" stroke="#222832"/>
    <rect x="48" y="45" width="38" height="34" rx="10" fill="url(#primary)"/>
    <path d="M57 55c4-7 8-7 12 0l5 13c3 7 8 7 10 0" fill="none" stroke="#10140c" stroke-width="4" stroke-linecap="round"/>
    <text x="100" y="61" class="strong">Mockoon <tspan fill="#d9ff3f">Live Studio</tspan></text>
    <text x="100" y="80" class="small">data/mockoon.json · version controlled</text>
    <rect x="1130" y="45" width="116" height="36" rx="10" fill="#141a23" stroke="#2a323e"/>
    <circle cx="1149" cy="63" r="5" fill="#43d68b"/>
    <text x="1161" y="68" class="small" fill="#dce2ea">Connected</text>
    <rect x="1260" y="42" width="132" height="42" rx="11" fill="url(#primary)"/>
    <text x="1289" y="69" fill="#10140c" font-size="16" font-weight="800">Push live</text>

    <!-- sidebar -->
    <rect x="24" y="100" width="330" height="646" fill="#0c1016"/>
    <path d="M354 100v646" stroke="#242b36"/>
    <text x="48" y="139" class="label">ENVIRONMENT</text>
    <text x="48" y="170" fill="#f5f7fa" font-size="25" font-weight="750">Storefront API</text>
    <rect x="48" y="194" width="282" height="40" rx="10" fill="#111720" stroke="#242d39"/>
    <text x="67" y="219" class="small">Filter routes…</text>

    <rect x="48" y="250" width="282" height="70" rx="12" fill="#111720" stroke="#242d39"/>
    <text x="76" y="277" class="small">◇ Data</text>
    <text x="150" y="277" class="small">↗ Callbacks</text>
    <text x="76" y="302" class="small">≡ Headers</text>
    <text x="178" y="302" class="small">⇄ Proxy &amp; TLS</text>

    <rect x="42" y="338" width="300" height="72" rx="12" fill="#19212c" stroke="#394352"/>
    <rect x="55" y="353" width="44" height="24" rx="7" fill="#153b2e"/>
    <text x="63" y="370" fill="#58e29c" font-size="12" font-weight="800">GET</text>
    <text x="113" y="363" class="strong" font-size="16">/api/products</text>
    <text x="113" y="387" class="small">Returns the product catalog</text>
    <rect x="42" y="420" width="300" height="72" rx="12" fill="#0e131b"/>
    <rect x="55" y="435" width="50" height="24" rx="7" fill="#162d48"/>
    <text x="62" y="452" fill="#69adff" font-size="12" font-weight="800">POST</text>
    <text x="113" y="445" class="body" font-size="16">/api/products</text>
    <text x="113" y="469" class="small">Creates a new product</text>
    <rect x="48" y="677" width="282" height="48" rx="10" fill="#111720" stroke="#242d39"/>
    <text x="65" y="706" class="small">{ }  Raw environment JSON</text>

    <!-- editor -->
    <rect x="354" y="100" width="1062" height="646" fill="#0d1118"/>
    <rect x="382" y="127" width="116" height="44" rx="10" fill="#151b24" stroke="#2a323e"/>
    <text x="407" y="155" class="strong" font-size="15">HTTP</text>
    <rect x="510" y="127" width="98" height="44" rx="10" fill="#151b24" stroke="#2a323e"/>
    <text x="538" y="155" fill="#80eeb1" font-size="15" font-weight="800">GET</text>
    <rect x="620" y="127" width="440" height="44" rx="10" fill="#111720" stroke="#2a323e"/>
    <text x="642" y="155" class="muted" font-size="16">/api/</text>
    <text x="686" y="155" class="body">products</text>
    <text x="1110" y="154" fill="#43d68b" font-size="14">● Saved</text>
    <rect x="1218" y="127" width="158" height="44" rx="10" fill="#21151a" stroke="#5c2837"/>
    <text x="1248" y="155" fill="#ff748f" font-size="15" font-weight="700">Delete route</text>

    <text x="382" y="205" class="label">DESCRIPTION</text>
    <text x="510" y="205" class="body">Returns the product catalog.</text>
    <text x="382" y="246" class="label">RESPONSE MODE</text>
    <rect x="382" y="258" width="240" height="40" rx="9" fill="#111720" stroke="#262f3b"/>
    <text x="401" y="283" class="small">Rules + default</text>
    <text x="642" y="246" class="label">FOLDER</text>
    <rect x="642" y="258" width="210" height="40" rx="9" fill="#111720" stroke="#262f3b"/>
    <text x="661" y="283" class="small">Root</text>

    <path d="M354 324h1062" stroke="#242b36"/>
    <rect x="354" y="324" width="280" height="422" fill="#0b0f15"/>
    <path d="M634 324v422" stroke="#242b36"/>
    <text x="382" y="360" class="label">RESPONSES</text>
    <text x="566" y="360" fill="#9aa4b3" font-size="14">＋ Add</text>
    <rect x="378" y="380" width="232" height="62" rx="11" fill="#19212c" stroke="#394352"/>
    <text x="397" y="417" fill="#58e29c" font-size="15" font-weight="800">200</text>
    <text x="451" y="417" class="body">Success</text>
    <circle cx="589" cy="411" r="5" fill="#d9ff3f"/>

    <!-- response editor -->
    <text x="665" y="357" class="label">STATUS</text>
    <rect x="665" y="369" width="100" height="45" rx="9" fill="#111720" stroke="#262f3b"/>
    <text x="686" y="398" class="body">200</text>
    <text x="785" y="357" class="label">LABEL</text>
    <rect x="785" y="369" width="316" height="45" rx="9" fill="#111720" stroke="#262f3b"/>
    <text x="805" y="398" class="body">Success</text>
    <text x="1121" y="357" class="label">LATENCY</text>
    <rect x="1121" y="369" width="160" height="45" rx="9" fill="#111720" stroke="#262f3b"/>
    <text x="1141" y="398" class="body">0 ms</text>

    <text x="665" y="463" fill="#d9ff3f" font-size="15" font-weight="750">Body</text>
    <text x="733" y="463" class="small">Headers 1</text>
    <text x="835" y="463" class="small">Rules 0</text>
    <text x="919" y="463" class="small">Callbacks 0</text>
    <text x="1026" y="463" class="small">Options</text>
    <path d="M658 480h710" stroke="#2a323e"/>
    <path d="M665 479h42" stroke="#d9ff3f" stroke-width="3"/>

    <rect x="665" y="501" width="150" height="36" rx="9" fill="#151b24" stroke="#303947"/>
    <text x="684" y="524" class="small">Inline  File  Data</text>
    <rect x="1038" y="501" width="196" height="36" rx="9" fill="#111720" stroke="#303947"/>
    <text x="1058" y="524" class="small">＋ Insert Faker/helper…</text>
    <rect x="665" y="552" width="703" height="154" rx="12" fill="#090d12" stroke="#28313d"/>
    <text x="690" y="582" fill="#596473" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">1</text>
    <text x="725" y="582" fill="#dce2ea" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">{</text>
    <text x="690" y="611" fill="#596473" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">2</text>
    <text x="750" y="611" fill="#9fe4ff" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">"items"</text>
    <text x="813" y="611" fill="#dce2ea" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">: [ ... ],</text>
    <text x="690" y="640" fill="#596473" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">3</text>
    <text x="750" y="640" fill="#9fe4ff" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">"requestId"</text>
    <text x="842" y="640" fill="#dce2ea" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">:</text>
    <text x="860" y="640" fill="#d9ff3f" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">"{{faker 'string.uuid'}}"</text>
    <text x="690" y="669" fill="#596473" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">4</text>
    <text x="725" y="669" fill="#dce2ea" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">}</text>

    <!-- callouts -->
    <circle cx="329" cy="279" r="16" fill="#d9ff3f"/><text x="324" y="285" fill="#10140c" font-size="15" font-weight="900">1</text>
    <circle cx="1070" cy="149" r="16" fill="#d9ff3f"/><text x="1065" y="155" fill="#10140c" font-size="15" font-weight="900">2</text>
    <circle cx="1235" cy="519" r="16" fill="#d9ff3f"/><text x="1230" y="525" fill="#10140c" font-size="15" font-weight="900">3</text>
    <circle cx="1392" cy="62" r="16" fill="#d9ff3f"/><text x="1387" y="68" fill="#10140c" font-size="15" font-weight="900">4</text>

    <rect x="24" y="746" width="1392" height="50" rx="0" fill="#0a0d12"/>
    <circle cx="49" cy="771" r="5" fill="#43d68b"/>
    <text x="63" y="777" class="small">Live traffic</text>
    <text x="495" y="777" class="callout">1 Environment tools</text>
    <text x="695" y="777" class="callout">2 Route configuration</text>
    <text x="927" y="777" class="callout">3 Faker &amp; helpers</text>
    <text x="1129" y="777" class="callout">4 Save &amp; push live</text>
  </g>
</svg>
