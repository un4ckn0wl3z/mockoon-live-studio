<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">Mockoon Live Studio editing and deployment workflow</title>
  <desc id="desc">Four steps: edit in the browser, save the repository JSON, synchronize Mockoon CLI, and commit and deploy with Git.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#121822"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dcff48"/>
      <stop offset="1" stop-color="#9fbd19"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#6d7888"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #f5f7fa; font-size: 24px; font-weight: 760; }
      .copy { fill: #929cab; font-size: 17px; }
      .code { fill: #dce2ea; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .step { fill: #10140c; font-size: 18px; font-weight: 900; }
    </style>
  </defs>
  <rect width="1440" height="470" rx="28" fill="url(#bg)"/>
  <g class="ui">
    <text x="58" y="61" fill="#8d96a6" font-size="14" font-weight="800" letter-spacing="1.8">RECOMMENDED WORKFLOW</text>
    <text x="58" y="99" fill="#f5f7fa" font-size="30" font-weight="780">Edit locally, version with Git, deploy anywhere</text>

    <path d="M344 253h54M698 253h54M1052 253h54" fill="none" stroke="#6d7888" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="48" y="138" width="296" height="250" rx="18" fill="#111720" stroke="#2a3340"/>
      <circle cx="85" cy="177" r="22" fill="url(#lime)"/>
      <text x="79" y="184" class="step">1</text>
      <text x="119" y="184" class="title">Edit in Studio</text>
      <rect x="72" y="215" width="248" height="82" rx="12" fill="#0a0f15" stroke="#28313d"/>
      <rect x="89" y="232" width="58" height="22" rx="6" fill="#143b2d"/>
      <text x="101" y="248" fill="#58e29c" font-size="12" font-weight="800">GET</text>
      <text x="160" y="248" class="code">/api/products</text>
      <rect x="89" y="265" width="210" height="15" rx="5" fill="#202a36"/>
      <text x="72" y="329" class="copy">Routes, rules, Faker, callbacks,</text>
      <text x="72" y="354" class="copy">data buckets, proxy and TLS.</text>

      <rect x="402" y="138" width="296" height="250" rx="18" fill="#111720" stroke="#2a3340"/>
      <circle cx="439" cy="177" r="22" fill="url(#lime)"/>
      <text x="433" y="184" class="step">2</text>
      <text x="473" y="184" class="title">Autosave JSON</text>
      <rect x="426" y="215" width="248" height="82" rx="12" fill="#0a0f15" stroke="#28313d"/>
      <path d="M451 232h44l18 18v29h-62z" fill="#182331" stroke="#4e6075"/>
      <path d="M495 232v18h18" fill="none" stroke="#4e6075"/>
      <text x="529" y="250" class="code">data/</text>
      <text x="529" y="275" fill="#d9ff3f" font-family="ui-monospace, SFMono-Regular, Consolas" font-size="15">mockoon.json</text>
      <text x="426" y="329" class="copy">Atomic writes and local history</text>
      <text x="426" y="354" class="copy">protect every saved change.</text>

      <rect x="756" y="138" width="296" height="250" rx="18" fill="#111720" stroke="#2a3340"/>
      <circle cx="793" cy="177" r="22" fill="url(#lime)"/>
      <text x="787" y="184" class="step">3</text>
      <text x="827" y="184" class="title">Sync Mockoon CLI</text>
      <rect x="780" y="215" width="248" height="82" rx="12" fill="#0a0f15" stroke="#28313d"/>
      <circle cx="808" cy="244" r="7" fill="#43d68b"/>
      <text x="825" y="250" class="code">Admin API · instant</text>
      <circle cx="808" cy="272" r="7" fill="#d9ff3f"/>
      <text x="825" y="278" class="code">File watch · ~500 ms</text>
      <text x="780" y="329" class="copy">Responses hot-update; structural</text>
      <text x="780" y="354" class="copy">changes reload automatically.</text>

      <rect x="1110" y="138" width="282" height="250" rx="18" fill="#111720" stroke="#2a3340"/>
      <circle cx="1147" cy="177" r="22" fill="url(#lime)"/>
      <text x="1141" y="184" class="step">4</text>
      <text x="1181" y="184" class="title">Commit &amp; deploy</text>
      <rect x="1134" y="215" width="234" height="82" rx="12" fill="#0a0f15" stroke="#28313d"/>
      <text x="1153" y="243" class="code">git add data/mockoon.json</text>
      <text x="1153" y="270" class="code">git commit &amp;&amp; git push</text>
      <text x="1134" y="329" class="copy">Clone the repository elsewhere,</text>
      <text x="1134" y="354" class="copy">then run Docker Compose.</text>
    </g>

    <rect x="48" y="416" width="1344" height="1" fill="#2a323e"/>
    <text x="48" y="447" fill="#818b99" font-size="15">Default: localhost-only ports · version-controlled mock config · no required .env file</text>
  </g>
</svg>
